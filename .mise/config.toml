[tools]
go = "1.27.3"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
"go:github.com/google/go-licenses/v2" = "v2.0.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
jactionlint = "2.4.0"
node = "26.13.0"
oxfmt = "0.75.0"

[settings]
experimental = true
pin = true
lockfile = true

[tasks.deps]
run = "go mod download"

[tasks.build]
run = "go build -o zagreus ./cmd/zagreus"

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.test]
description = "Vet Go code and run race-enabled tests"
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.lint-fix]
run = "golangci-lint run --fix"

[tasks.lint]
run = "golangci-lint run"

[tasks.format]
run = "go fmt ./..."

[tasks.fmt-check]
run = '''
unformatted=$(gofmt -l .) || exit 1
test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
'''

[tasks.clean]
run = "rm -f zagreus coverage.out && rm -rf dist"

[tasks.container-build]
run = '''
docker build \
  --build-arg GO_VERSION="$(mise config get tools.go)" \
  --build-arg GO_LICENSES_VERSION="$(mise tool go:github.com/google/go-licenses/v2 --requested)" \
  -t zagreus:local .
'''

[hooks]
postinstall = "lefthook install"
